<body>
<h1>工具王 TOOL KING</h1>
<div class="sub">工具を知る者が、バトルを制す。（試作版 v0.6）<br>カードの数字：左＝ジャンケンに勝った時／右＝負け・あいこの時</div>
<div id="app"></div>

<script id="logic">
var CARDS = [
  {id:"hammer",name:"ハンマー",hand:"g",win:1000,lose:200,type:"一撃型"},
  {id:"monkey",name:"モンキーレンチ",hand:"g",win:850,lose:350,type:"万能型"},
  {id:"pliers",name:"ペンチ",hand:"g",win:750,lose:450,type:"バランス型"},
  {id:"spanner",name:"スパナ",hand:"g",win:700,lose:400,type:"堅実型"},
  {id:"vise",name:"万力",hand:"g",win:700,lose:500,type:"粘り型"},
  {id:"hexkey",name:"六角レンチ",hand:"g",win:600,lose:500,type:"小粒型"},
  {id:"micrometer",name:"マイクロメータ",hand:"c",win:1000,lose:200,type:"精密型の極み"},
  {id:"caliper",name:"ノギス",hand:"c",win:900,lose:300,type:"精密型"},
  {id:"nipper",name:"ニッパー",hand:"c",win:850,lose:350,type:"切れ味型"},
  {id:"hacksaw",name:"金切りのこ",hand:"c",win:800,lose:400,type:"力技型"},
  {id:"soldering",name:"はんだごて",hand:"c",win:700,lose:400,type:"じわじわ型"},
  {id:"radiopliers",name:"ラジオペンチ",hand:"c",win:600,lose:500,type:"器用型"},
  {id:"drillpress",name:"ボール盤",hand:"p",win:950,lose:250,type:"大型機械型"},
  {id:"phillips",name:"プラスドライバー",hand:"p",win:750,lose:450,type:"定番型"},
  {id:"squareruler",name:"さしがね",hand:"p",win:700,lose:500,type:"基準型"},
  {id:"flathead",name:"マイナスドライバー",hand:"p",win:700,lose:450,type:"汎用型"},
  {id:"file",name:"やすり",hand:"p",win:650,lose:550,type:"削り型"},
  {id:"tester",name:"テスター",hand:"p",win:600,lose:500,type:"検査型"}
];
var BARRIER = 3, START_HAND = 1;

function shuffle(a){
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
// a から見て 1:勝ち / -1:負け / 0:あいこ
function judge(a, b){
  if (a === b) return 0;
  if ((a === "g" && b === "c") || (a === "c" && b === "p") || (a === "p" && b === "g")) return 1;
  return -1;
}
function newPlayer(){
  var p = { deck: shuffle(CARDS.slice()), barrier: [], hand: [], field: null, trash: [] };
  var i;
  for (i = 0; i < BARRIER; i++) p.barrier.push(p.deck.pop());
  for (i = 0; i < START_HAND; i++) p.hand.push(p.deck.pop());
  return p;
}
function newGame(){
  return { p: [newPlayer(), newPlayer()], turn: 1, over: false, winner: null, reason: "" };
}
function draw(p){
  if (p.deck.length === 0) return false;
  p.hand.push(p.deck.pop());
  return true;
}
// ドローフェイズ。山札切れならバリアが多い方の勝ち（同数は引き分け）
function beginTurn(g){
  var a = draw(g.p[0]), b = draw(g.p[1]);
  if (!a || !b) {
    g.over = true;
    g.reason = "山札切れ（バリアの枚数で判定）";
    var x = g.p[0].barrier.length, y = g.p[1].barrier.length;
    g.winner = x > y ? 0 : (y > x ? 1 : -1);
  }
}
// ch: 手札の番号、または -1（場のカードをそのまま使う）
function play(g, ch0, ch1){
  var ch = [ch0, ch1], i;
  for (i = 0; i < 2; i++) {
    var p = g.p[i];
    if (ch[i] >= 0) {
      if (p.field) p.trash.push(p.field);
      p.field = p.hand.splice(ch[i], 1)[0];
    }
  }
  var c0 = g.p[0].field, c1 = g.p[1].field;
  var r = judge(c0.hand, c1.hand);
  var v0 = (r === 1) ? c0.win : c0.lose;
  var v1 = (r === -1) ? c1.win : c1.lose;
  var w = v0 > v1 ? 0 : (v1 > v0 ? 1 : -1);
  var res = { cards: [c0, c1], vals: [v0, v1], jk: r, winner: w, barrierLost: -1, over: false };
  if (w !== -1) {
    var l = 1 - w, lp = g.p[l];
    if (lp.barrier.length === 0) {
      g.over = true; g.winner = w; g.reason = "バリア0枚でバトルに負けた"; res.over = true;
    } else {
      lp.hand.push(lp.barrier.pop());
      res.barrierLost = l;
    }
  }
  for (i = 0; i < 2; i++) {
    if (i !== w) { g.p[i].trash.push(g.p[i].field); g.p[i].field = null; }
  }
  g.turn++;
  return res;
}
function cpuChoice(p){
  if (p.field && Math.random() < 0.5) return -1;
  return Math.floor(Math.random() * p.hand.length);
}
</script>

  squareruler: function(){ var t=''; var i; for (i=26;i<66;i+=4) t += ln(i,42,i,(i%8===2?47:45),K,1); for (i=12;i<42;i+=4) t += ln(22,i,(i%8===0?27:25),i,K,1); return '<path d="M12 4 H22 V42 H70 V52 H12 Z" fill="'+S+'" stroke="'+SD+'" stroke-width="1.5" stroke-linejoin="round"/>' + t; },
  flathead: function(){ return rot(-35, rc(33,28,14,28,6,B) + ln(37,31,37,53,'#234f94',1.5) + ln(43,31,43,53,'#234f94',1.5) + rc(38.8,10,2.4,20,1,S) + '<polygon points="36,3 44,3 41.5,13 38.5,13" fill="'+SD+'"/>'); },
  file: function(){ var h=''; for (var y=8;y<38;y+=4) h += ln(34,y,46,y+3,SD,1); return rot(-30, '<polygon points="33,40 47,40 44,3 36,3" fill="'+S+'" stroke="'+SD+'" stroke-width="1.2"/>' + h + rc(34,38,12,5,1,SD) + rc(35.5,43,9,15,4,W) + ln(38,46,38,55,WD,1.3)); },
  tester: function(){ return rc(21,3,38,54,6,Y) + rc(26,8,28,15,2,K) + '<text x="40" y="20" text-anchor="middle" font-size="10" font-weight="700" font-family="ui-monospace,Menlo,monospace" fill="#8cff9a">8.8.8</text>' + ci(40,38,10,K) + ci(40,38,7.5,'#ffffff') + ln(40,38,45,33,R,1.8) + ci(40,38,1.6,K) + ci(30,52,2.2,K) + ci(40,52,2.2,R) + ci(50,52,2.2,K); }
};
function cardHTML(c, tag, act, extra){
  var svg = '<svg viewBox="0 0 80 60" aria-hidden="true">' + ART[c.id](ART_BG[c.hand]) + '</svg>';
  var inner = '<div class="hd"><span class="hi">' + ICON[c.hand] + '</span>' + HAND_NAME[c.hand] + '</div>' +
    '<div class="art">' + svg + '</div>' +
    '<div class="nm' + (c.name.length >= 8 ? ' long' : '') + '"><span>' + c.name + '</span></div>' +
    '<div class="tp"><span>' + c.type + '</span></div>' +
    '<div class="vals"><div class="v w"><i>勝ち</i><b>' + c.win + '</b></div><div class="v l"><i>負け</i><b>' + c.lose + '</b></div></div>';
  if (tag === "button") return '<button class="card ' + c.hand + (extra ? ' ' + extra : '') + '" data-act="' + act + '" aria-label="' + c.name + '">' + inner + '</button>';
  return '<div class="card ' + c.hand + '">' + inner + '</div>';
}
function backCardHTML(){
  return '<div class="card back"><div class="ic">🔧</div><div class="bt">工具王</div></div>';
}
function flipHTML(card, open, extra){
  return '<div class="flip' + (open ? ' open' : '') + (extra || '') + '"><div class="fi">' +
    '<div class="fb">' + backCardHTML() + '</div><div class="ff">' + cardHTML(card) + '</div></div></div>';
}
function backOnlyHTML(){
  return '<div class="flip"><div class="fi"><div class="fb">' + backCardHTML() + '</div></div></div>';
}

var MODE = "cpu";      // "cpu" = CPU対戦 / "pvp" = 1台を交代で使う2人対戦
var viewer = 0;        // いま画面を見て選んでいるプレイヤー
var sel = [null, null];// 各プレイヤーが選んだカード（手札の番号 / -1=キープ / null=未選択）
var snap = null;       // 演出中に見せる、結果を反映する前の枚数
var busy = false;
var askMenu = false;
var timers = [];
function later(ms, fn){
  var t = { fn: fn, done: false };
  t.id = setTimeout(function(){ if (t.done) return; t.done = true; fn(); }, ms);
  timers.push(t);
}
function skipAll(){
  var ts = timers; timers = [];
  for (var i = 0; i < ts.length; i++) {
    if (!ts[i].done) { clearTimeout(ts[i].id); ts[i].done = true; ts[i].fn(); }
  }
}
function who(i){ return MODE === "cpu" ? (i === 0 ? "あなた" : "CPU") : "プレイヤー" + (i + 1); }
function zoneTitle(i){ return MODE === "cpu" ? (i === 0 ? "あなた" : "CPU（相手）") : "プレイヤー" + (i + 1); }
function zoneBar(i){ return MODE === "cpu" ? (i === 0 ? "あなたのバトル場" : "相手のバトル場") : "プレイヤー" + (i + 1) + "のバトル場"; }

function counts(i){
  var p = G.p[i];
  if (phase === "revealing" && snap) return snap[i];
  return { barrier: p.barrier.length, deck: p.deck.length, hand: p.hand.length };
}
function pips(n){
  var s = "";
  for (var i = 0; i < BARRIER; i++) s += '<span class="pip' + (i < n ? ' on' : '') + '"></span>';
  return s;
}
function slotHTML(i){
  var p = G.p[i], inner, label = "", cls = "";
  var showLast = last && (phase === "revealing" || phase === "result" || phase === "over");
  if (showLast) {
    var open = phase !== "revealing", w = last.winner;
    if (open) {
      cls = (w === i) ? " win" : (w === -1 ? " draw" : " lose");
      label = (w === i) ? "★ 場に残る" : "→ トラッシュへ";
    }
    inner = flipHTML(last.cards[i], open, "");
  } else if ((phase === "set" || phase === "confirm") && sel[i] !== null) {
    inner = backOnlyHTML();
    label = (i === viewer) ? "セット済み（裏向き）" : (MODE === "cpu" ? "CPUもセット済み" : "セット済み（裏向き）");
  } else if (p.field) {
    inner = cardHTML(p.field);
    label = "場に残っているカード";
  } else {
    inner = '<div class="empty">カードなし</div>';
  }
  return '<div class="slot' + cls + '">' + inner + '<div class="sl">' + label + '</div></div>';
}
function zoneHTML(i){
  var c = counts(i);
  return '<section class="zone ' + (i === 0 ? 'me' : 'cpu') + '">' +
    '<div class="zbar">' + zoneBar(i) + '</div>' +
    '<div class="zbody"><div class="zh"><div class="zt">' + zoneTitle(i) + '</div>' +
    '<div class="row"><span>バリア</span>' + pips(c.barrier) + '</div>' +
    '<div class="row"><span>山札</span><b>' + c.deck + '</b></div>' +
    '<div class="row"><span>手札</span><b>' + c.hand + '</b></div></div>' +
    slotHTML(i) + '</div></section>';
}
function valLabel(side){
  if (last.jk === 0) return "あいこ値";
  var won = (side === 0) ? (last.jk === 1) : (last.jk === -1);
  return won ? "勝ち値" : "負け値";
}
function verdictHTML(full){
  var jk = last.jk === 1 ? who(0) + "の勝ち" : (last.jk === -1 ? who(1) + "の勝ち" : "あいこ");
  var h = '<div class="vd"><div class="vj">' + ICON[last.cards[0].hand] + ' VS ' + ICON[last.cards[1].hand] + '　ジャンケン：<b>' + jk + '</b></div>' +
    '<div class="vv"><span class="a">' + who(0) + '<b>' + last.vals[0] + '</b><i>' + valLabel(0) + '</i></span><span class="x">VS</span>' +
    '<span class="b">' + who(1) + '<b>' + last.vals[1] + '</b><i>' + valLabel(1) + '</i></span></div>';
  if (full) {
    if (last.winner === -1) h += '<div class="vo">引き分け。両方トラッシュへ</div>';
    else h += '<div class="vo ' + (last.winner === 0 ? 'mine' : 'theirs') + '">' + who(last.winner) + 'のバトル勝利！</div>';
    if (last.barrierLost >= 0) h += '<div class="vb">' + who(last.barrierLost) + 'のバリアが1枚減って、手札に加わった</div>';
  }
  return h + '</div>';
}
function midHTML(){
  if (phase === "revealing") return '<div class="mid-big">ご安全に！</div><div class="mid-s">タップで演出をとばす</div>';
  if (last && (phase === "result" || phase === "over")) return verdictHTML(true);
  if (phase === "confirm") return '<div class="mid-t">第' + G.turn + 'ターン　2人ともセット完了、ヨシ！<br>スマホを机に置いて、2人で画面を見てね</div>';
  if (phase === "set") {
    var t = '第' + G.turn + 'ターン　', picked = sel[viewer] !== null;
    if (MODE === "cpu") t += picked ? 'セット完了、ヨシ！「ご安全に！」でオープン' : '手札からカードを選んでセット';
    else if (!picked) t += who(viewer) + 'が選択中。手札からカードを選んでセット';
    else if (viewer === 0) t += 'セット完了、ヨシ！プレイヤー2に渡してください';
    else t += 'セット完了、ヨシ！「セット決定」を押してね';
    return '<div class="mid-t">' + t + '</div>';
  }
  return '';
}
function handHTML(){
  var pl = G.p[viewer], s = sel[viewer];
  var title = MODE === "cpu" ? "あなたの手札" : "プレイヤー" + (viewer + 1) + "の手札";
  var h = '<section class="hz p' + viewer + '"><div class="hzt">' + title + '（タップでセット）</div>';
  if (pl.field) h += '<button class="btn sub2' + (s === -1 ? ' on' : '') + '" data-act="keep">場のカードをそのまま使う（キープ）</button><div style="height:8px"></div>';
  h += '<div class="hand">';
  for (var i = 0; i < pl.hand.length; i++) h += cardHTML(pl.hand[i], "button", "pick:" + i, (s === i) ? "sel" : "");
  h += '</div>';
  if (pl.field) h += '<div class="small" style="margin-top:6px">手札から選ぶと、場のカードはトラッシュに置かれます</div>';
  return h + '</section>';
}
function overHTML(){
  var msg = G.winner === -1 ? "引き分け" : (MODE === "cpu" ? (G.winner === 0 ? "あなたの勝ち！" : "CPUの勝ち…") : who(G.winner) + "の勝ち！");
  return '<div class="result over"><div class="big">' + msg + '</div><div>' + G.reason + '</div>' +
    '<button class="btn" data-act="restart">もう一度あそぶ</button></div>';
}
function menuHTML(){
  return '<section class="menu"><div class="mn-t">モードをえらぶ</div>' +
    '<button class="btn" data-act="cpu">CPUと対戦<small>ひとりで練習</small></button>' +
    '<button class="btn alt" data-act="pvp">2人で対戦<small>1台のスマホを交代で使う</small></button>' +
    '<div class="rules"><b>ルール</b><br>' +
    '・バリアは3枚。バリアが0枚の状態でバトルに負けたら負け。<br>' +
    '・ジャンケンに勝ったら左の数字、負け・あいこなら右の数字を使う。<br>' +
    '・数字が大きい方が勝ち。負けた方はバリアを1枚失い、手札に加える。<br>' +
    '・勝ったカードは場に残る。次のターンはそのまま使うか、手札と交換するか選べる。</div></section>';
}
function handoffHTML(){
  var n = viewer + 1;
  return '<section class="handoff p' + viewer + '"><div class="small">第' + G.turn + 'ターン</div>' +
    '<div class="ho-t">プレイヤー' + n + 'に渡してください</div>' +
    '<div class="ho-s">手札と選んだカードは、相手に見せないでね</div>' +
    '<button class="btn" data-act="ready">プレイヤー' + n + 'です。カードを選ぶ</button></section>';
}
function render(){
  var h = "";
  if (phase === "menu") h = menuHTML();
  else if (phase === "handoff") h = handoffHTML();
  else {
    h = zoneHTML(1 - viewer) +
      '<div class="mid" id="mid"' + (phase === "revealing" ? ' data-act="skip"' : '') + '>' + midHTML() + '</div>' +
      zoneHTML(viewer);
    if (phase === "over") h += overHTML();
    if (phase === "set" && !G.over) h += handHTML();
    if (phase === "confirm") h += '<button class="btn kai open2" data-act="open">ご安全に！</button>';
    if (phase === "result") h += '<button class="btn" data-act="next">次のターンへ</button>';
    if (phase === "set" && sel[viewer] !== null) {
      if (MODE === "pvp" && viewer === 0) h += '<div class="dock"><button class="btn pass" data-act="pass">セット完了。プレイヤー2に渡す</button></div>';
      else if (MODE === "pvp") h += '<div class="dock"><button class="btn pass cf" data-act="confirm">セット決定</button></div>';
      else h += '<div class="dock"><button class="btn kai" data-act="open">ご安全に！</button></div>';
    }
    if (phase !== "revealing") h += '<button class="btn quit" data-act="menu">' + (askMenu ? '本当に戻る？ もう一度タップ' : 'メニューに戻る') + '</button>';
  }
  app.innerHTML = h;
}

function startGame(mode){
  skipAll(); timers = [];
  MODE = mode || MODE;
  G = newGame(); last = null; sel = [null, null]; viewer = 0; busy = false; snap = null; askMenu = false;
  beginTurn(G);
  phase = G.over ? "over" : (MODE === "pvp" ? "handoff" : "set");
  render();
}
function pick(a){
  if (phase !== "set" || G.over || busy) return;
  if (sel[viewer] === a) { sel[viewer] = null; if (MODE === "cpu") sel[1] = null; }
  else { sel[viewer] = a; if (MODE === "cpu" && sel[1] === null) sel[1] = cpuChoice(G.p[1]); }
  render();
}
function openAt(idx){
  var els = app.querySelectorAll(".flip");
  if (els[idx]) { els[idx].classList.remove("shake"); els[idx].classList.add("open"); }
}
function reveal(){
  if ((phase !== "set" && phase !== "confirm") || sel[0] === null || sel[1] === null || busy) return;
  if (MODE === "pvp" && phase !== "confirm") return;
  busy = true; timers = [];
  snap = [0, 1].map(function(i){
    var p = G.p[i];
    return { barrier: p.barrier.length, deck: p.deck.length, hand: p.hand.length - (sel[i] >= 0 ? 1 : 0) };
  });
  last = play(G, sel[0], sel[1]);
  sel = [null, null];
  phase = "revealing";
  render();
  var mid = document.getElementById("mid");
  if (mid && mid.scrollIntoView) { try { mid.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) {} }
  later(150, function(){ openAt(1); openAt(0); });   // 2枚を同時にオープン
  later(1400, function(){
    var m = document.getElementById("mid");
    if (m) m.innerHTML = verdictHTML(false);
  });
  later(2500, function(){
    busy = false; snap = null;
    phase = G.over ? "over" : "result";
    render();
  });
}
function act(a){
  if (a !== "menu") askMenu = false;
  if (a === "cpu" || a === "pvp") { startGame(a); return; }
  if (a === "restart") { startGame(MODE); return; }
  if (a === "menu") {
    if (!askMenu) { askMenu = true; render(); return; }
    askMenu = false; skipAll(); timers = []; busy = false; phase = "menu"; render(); return;
  }
  if (a === "skip") { skipAll(); return; }
  if (a === "ready") { if (phase === "handoff") { phase = "set"; render(); } return; }
  if (a === "pass") { if (phase === "set" && MODE === "pvp" && viewer === 0 && sel[0] !== null) { viewer = 1; phase = "handoff"; render(); } return; }
  if (a === "confirm") {
    if (phase === "set" && MODE === "pvp" && viewer === 1 && sel[1] !== null) {
      phase = "confirm"; render();
      try { window.scrollTo(0, 0); } catch (e) {}
    }
    return;
  }
  if (a === "next") {
    if (phase !== "result") return;
    beginTurn(G); last = null; sel = [null, null]; viewer = 0;
    phase = G.over ? "over" : (MODE === "pvp" ? "handoff" : "set");
    render(); return;
  }
  if (a === "open") { reveal(); return; }
  if (a === "keep") { if (phase === "set" && G.p[viewer].field) pick(-1); return; }
  if (a.indexOf("pick:") === 0) pick(parseInt(a.split(":")[1], 10));
}
app.addEventListener("click", function(e){
  var t = e.target;
  while (t && t !== app) {
    if (t.getAttribute && t.getAttribute("data-act")) { act(t.getAttribute("data-act")); return; }
    t = t.parentNode;
  }
});
phase = "menu";
render();
</script>
</body>
</html>
